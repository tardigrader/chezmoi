[fedora]
additional_packages="bat black fd-find fzf maven python3-flake8 python3-pip python3-ipython ripgrep ruff ShellCheck uv"
additional_packages="ansible helix htop neovim pass pwgen python3-ansible-lint ranger strace sxiv vim"
additional_packages="golang"
additional_packages="pavucontrol pipewire-utils pulseaudio-utils"
additional_packages="flatpak-spawn virt-viewer"
additional_packages="perl-Image-ExifTool ImageMagick"
additional_packages="ngrep nmap wireshark-cli tcpdump remmina remmina-plugins-rdp sipcalc"
additional_packages="gnome-tweaks zathura zathura-plugins-all"
additional_packages="p7zip p7zip-plugins unrar"
image=registry.fedoraproject.org/fedora-toolbox:44
init=false
nvidia=false
pull=true
root=false
replace=true
start_now=false
exported_bins="/usr/bin/bat /usr/bin/fd /usr/bin/fzf /usr/bin/htop /usr/bin/hx /usr/bin/nvim"
exported_bins="/usr/bin/rg /usr/bin/sxiv /usr/bin/zathura"
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/xdg-open;

